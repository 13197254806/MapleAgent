client:
  # null = automatically discover the server on the local network.
  server_url: null
  # Match the executable name shown in Task Manager; .exe is optional.
  process_name: Maplestory_Classic
  # Optional title filter. Keep null unless the process owns multiple windows.
  window_title: null
  # print_window captures an obscured/background window without taking focus.
  capture_backend: print_window
  fps: 12
  jpeg_quality: 75
  heartbeat_interval_ms: 300
  watchdog_timeout_ms: 1000
  emergency_key: F12
  reconnect_delay_ms: 1000

frame:
  width: 1280
  height: 720
  max_bytes: 2000000

discovery:
  enabled: true
  service_name: maple-agent-v1
  port: 8764
  broadcast_addresses: [255.255.255.255]
  timeout_ms: 500
  attempts: 3

input:
  bindings:
    LEFT: LEFT
    RIGHT: RIGHT
    UP: UP
    DOWN: DOWN
    JUMP: SPACE
    ATTACK: X
    HP_POTION: "1"
    MP_POTION: "2"
  tap_duration_ms: 45
  mouse_tap_duration_ms: 45
  allowed_mouse_buttons: [LEFT]
