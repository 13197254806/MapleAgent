server:
  host: 0.0.0.0
  port: 8765
  heartbeat_timeout_ms: 1000
  max_frame_age_ms: 1200

frame:
  width: 1280
  height: 720
  max_bytes: 2000000

discovery:
  enabled: true
  service_name: maple-agent-v1
  bind_host: 0.0.0.0
  port: 8764

database:
  enabled: true
  host: 127.0.0.1
  port: 3306
  user: root
  password: null
  password_env: MAPLE_AGENT_MYSQL_PASSWORD
  database: maple_agent
  connect_timeout_seconds: 5
  queue_capacity: 10000

perception:
  rois:
    minimap: [0.0, 0.0, 0.30, 0.30]
    hp: [0.20, 0.94, 0.20, 0.025]
    mp: [0.60, 0.94, 0.20, 0.025]
  detector:
    backend: template
    model_path: null
    templates_dir: ../assets/templates
    confidence_threshold: 0.72
    nms_threshold: 0.40
    input_width: 640
    input_height: 640
    class_names: [player, monster, death_dialog, blocking_dialog]
  minimap_player_hsv:
    lower: [0, 0, 225]
    upper: [180, 55, 255]
  hp_hsv:
    lower: [0, 120, 80]
    upper: [12, 255, 255]
  mp_hsv:
    lower: [95, 100, 70]
    upper: [135, 255, 255]
  min_color_pixels: 4
  smoothing_window: 5
  player_missing_limit: 6
  stuck_window_ms: 2500
  stuck_distance_px: 4.0

control:
  mode: patrol
  plan_ttl_ms: 800
  walk_duration_ms: 180
  attack_duration_ms: 220
  recovery_duration_ms: 180
  combat_range_px: 190
  attack_cooldown_ms: 450
  potion_cooldown_ms: 1000
  hp_potion_threshold: 0.35
  mp_potion_threshold: 0.20

recorder:
  root_dir: ../recordings
  save_every_nth_frame: 1

logging:
  level: INFO
  console: true
  file: ../logs/server.log
  max_bytes: 10000000
  backup_count: 5
  access_log: false

map:
  path: ../maps/example_map.json
  node_snap_distance: 18
  mapping_node_distance: 20
